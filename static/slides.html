<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="slideshow">
  <div id="slideshow-container">
    <div id="loading">Loading images...</div>
    <img id="current-image" alt="Slideshow image">
    <img id="preload-image" alt="">
  </div>

  <div id="pause-indicator" class="indicator">PAUSED</div>

  <div id="action-indicator" class="indicator"></div>

  <div id="image-counter"></div>

  <!-- Main menu: shown when user presses Esc -->
  <div id="menu-overlay" class="overlay">
    <div id="menu-content" class="panel">
      <h2>Slideshow Menu</h2>
      <p><span class="key">Space</span> Pause / Resume</p>
      <p><span class="key">Esc</span> Toggle this menu</p>
      <p><span class="key">←</span> Previous image</p>
      <p><span class="key">→</span> Next image</p>
      <div class="menu-btn-group">
        <button id="notes-btn" class="btn btn-secondary" style="display:none;">Notes</button>
        <button id="resume-btn" class="btn btn-primary">Resume</button>
      </div>
      <p class="menu-link"><a id="params-link" href="/params">Settings</a></p>
    </div>
  </div>

  <!-- Notes form -->
  <div id="notes-overlay" class="overlay">
    <div class="panel notes-form">
      <h2>Notes</h2>
      <div class="form-info">
        <p><strong>ID:</strong> <span id="notes-foto-id"></span> &nbsp; <strong>MD5:</strong> <span class="notes-md5"></span></p>
        <p><strong>Filename:</strong> <span id="notes-filename"></span></p>
        <p><strong>Path:</strong> <span id="notes-path" class="path-text"></span></p>
        <p><strong>Photo date:</strong> <span id="notes-date"></span> &nbsp; <strong>Size:</strong> <span id="notes-img-size"></span></p>
        <p><strong>Note date:</strong> <span id="notes-note-dt"></span> &nbsp; <strong>MD5:</strong> <span class="notes-md5"></span></p>
      </div>
      <div class="field">
        <label for="notes-title">Title</label>
        <input type="text" id="notes-title" class="input" maxlength="60" placeholder="Short title...">
      </div>
      <div class="field">
        <label for="notes-rename-to">Rename to</label>
        <input type="text" id="notes-rename-to" class="input" maxlength="90" placeholder="New filename...">
      </div>
      <div class="row">
        <div class="field">
          <label for="notes-action">Action</label>
          <input type="text" id="notes-action" class="input" maxlength="12" placeholder="e.g. delete">
        </div>
        <div class="field">
          <label for="notes-status">Status</label>
          <input type="text" id="notes-status" class="input" maxlength="10">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="notes-category">Category</label>
          <input type="text" id="notes-category" class="input" maxlength="16">
        </div>
        <div class="field">
          <label for="notes-rank">Rank (0–9)</label>
          <input type="number" id="notes-rank" class="input" min="0" max="9">
        </div>
      </div>
      <div class="field">
        <label for="notes-location">Location</label>
        <input type="text" id="notes-location" class="input">
      </div>
      <div class="field">
        <label for="notes-note">Note</label>
        <textarea id="notes-note" class="input" rows="4" maxlength="1024" placeholder="Enter notes..."></textarea>
      </div>
      <div id="notes-msg" class="action-status"></div>
      <div class="form-buttons">
        <button id="notes-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="notes-submit-btn" class="btn btn-primary">Save Note</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
